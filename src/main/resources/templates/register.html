<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>TradeGuard AI - Register</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }
        body {
            background: linear-gradient(135deg, #070b14, #0d1320, #111827);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .register-container {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 30px;
            padding: 50px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 0 40px rgba(0,255,204,0.1);
        }
        h1 { color: #00ffcc; margin-bottom: 10px; font-size: 32px; }
        .subtitle { color: #9ca3af; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #9ca3af; font-size: 14px; }
        input, select {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: white;
            font-size: 15px;
            transition: 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #00ffcc;
            box-shadow: 0 0 20px rgba(0,255,204,0.1);
        }
        .btn-register {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00ffcc, #00bfff);
            color: #070b14;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-register:hover { transform: scale(1.02); box-shadow: 0 0 30px rgba(0,255,204,0.3); }
        .login-link { text-align: center; margin-top: 20px; color: #6b7280; }
        .login-link a { color: #00ffcc; text-decoration: none; }
        .login-link a:hover { text-decoration: underline; }
        .error { color: #ff4d4d; font-size: 13px; margin-top: 5px; }
        .plan-options {
            display: flex;
            gap: 15px;
            margin: 10px 0;
        }
        .plan-option {
            flex: 1;
            padding: 15px;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .plan-option:hover { border-color: #00ffcc; }
        .plan-option.selected { border-color: #00ffcc; background: rgba(0,255,204,0.05); }
        .plan-option .name { font-weight: bold; font-size: 18px; }
        .plan-option .price { color: #9ca3af; font-size: 14px; }
        .plan-option .free { color: #00ff88; }
        .plan-option .pro { color: #ffae42; }
    </style>
</head>
<body>
    <div class="register-container">
        <h1>🚀 Create Account</h1>
        <p class="subtitle">Start your AI trading journey</p>
        
        <form th:action="@{/register}" th:object="${registerRequest}" method="post">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" th:field="*{fullName}" placeholder="Enter your full name" required>
                <div class="error" th:errors="*{fullName}"></div>
            </div>
            
            <div class="form-group">
                <label>Email</label>
                <input type="email" th:field="*{email}" placeholder="Enter your email" required>
                <div class="error" th:errors="*{email}"></div>
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" th:field="*{password}" placeholder="Min 6 characters" required>
                <div class="error" th:errors="*{password}"></div>
            </div>
            
            <div class="form-group">
                <label>Choose Your Plan</label>
                <div class="plan-options">
                    <div class="plan-option selected" onclick="selectPlan(this, 'FREE')">
                        <div class="name free">FREE</div>
                        <div class="price">$0 / mo</div>
                    </div>
                    <div class="plan-option" onclick="selectPlan(this, 'PRO')">
                        <div class="name pro">PRO</div>
                        <div class="price">$29 / mo</div>
                    </div>
                </div>
                <input type="hidden" th:field="*{plan}" value="FREE">
            </div>
            
            <button type="submit" class="btn-register">🚀 Create Account</button>
        </form>
        
        <div class="login-link">
            Already have an account? <a href="/login">Login</a>
        </div>
    </div>
    
    <script>
        function selectPlan(element, plan) {
            document.querySelectorAll('.plan-option').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            document.querySelector('input[name="plan"]').value = plan;
        }
    </script>
</body>
</html>

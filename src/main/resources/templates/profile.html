<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>TradeGuard AI - Profile</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="shortcut icon" th:href="@{/img/tradeguard.png}" type="image/x-icon">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }
        body {
            background: linear-gradient(135deg, #070b14, #0d1320, #111827);
            color: white;
            padding: 25px;
            min-height: 100vh;
        }
        .page-title { font-size: 28px; font-weight: bold; color: #00ffcc; margin: 20px 0 30px; }
        .profile-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 0 20px rgba(0,255,255,0.08);
        }
        .profile-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00ffcc, #00bfff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            margin: 0 auto 15px;
        }
        .plan-badge {
            display: inline-block;
            padding: 6px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        .plan-free { background: rgba(0,255,136,0.15); border: 1px solid #00ff88; color: #00ff88; }
        .plan-pro { background: rgba(255,174,66,0.15); border: 1px solid #ffae42; color: #ffae42; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #9ca3af; font-size: 14px; }
        input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: white;
            font-size: 15px;
            transition: 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #00ffcc;
            box-shadow: 0 0 20px rgba(0,255,204,0.1);
        }
        input:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-save {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00ffcc, #00bfff);
            color: #070b14;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-save:hover { transform: scale(1.02); box-shadow: 0 0 30px rgba(0,255,204,0.3); }
        .success-msg {
            background: rgba(0,255,136,0.1);
            border: 1px solid #00ff88;
            color: #00ff88;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
        }
        .footer { text-align: center; margin-top: 40px; color: #6b7280; }
    </style>
</head>
<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="page-title">👤 My Profile</div>

<div class="profile-card">
    <div class="profile-header">
        <div class="avatar">👤</div>
        <h2 th:text="${user.fullName}">User Name</h2>
        <div th:if="${user.role == 'FREE'}" class="plan-badge plan-free">📊 FREE Plan</div>
        <div th:if="${user.role == 'PRO'}" class="plan-badge plan-pro">💎 PRO Plan</div>
    </div>
    
    <div th:if="${param.success}" class="success-msg">✅ Profile updated successfully!</div>
    
    <form action="/profile/update" method="post">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="fullName" th:value="${user.fullName}" required>
        </div>
        
        <div class="form-group">
            <label>Email</label>
            <input type="email" th:value="${user.email}" disabled>
        </div>
        
        <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" name="phoneNumber" th:value="${user.phoneNumber}" placeholder="+91 98765 43210">
        </div>
        
        <div class="form-group">
            <label>Country</label>
            <input type="text" name="country" th:value="${user.country}" placeholder="Your country">
        </div>
        
        <button type="submit" class="btn-save">💾 Save Profile</button>
    </form>
</div>

<div class="footer">TradeGuard AI © 2026 — Built for Bitget Hackathon</div>

</body>
</html>

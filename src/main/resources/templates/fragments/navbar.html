<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <link rel="shortcut icon" th:href="@{/img/tradeguard.png}" type="image/x-icon">
</head>
<body>
<nav th:fragment="navbar" 
     style="display:flex;justify-content:space-between;align-items:center;padding:14px 30px;background:rgba(255,255,255,0.02);border-bottom:1px solid rgba(255,255,255,0.06);position:sticky;top:0;z-index:999;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);flex-wrap:wrap;gap:10px;">

    <!-- Logo -->
    <div style="font-size:20px;font-weight:700;color:#00ffcc;display:flex;align-items:center;gap:6px;">
        <a href="/" style="text-decoration:none;color:#00ffcc;font-size:clamp(18px,2vw,24px);">🚀 TradeGuard AI</a>
    </div>

    <!-- Nav Links -->
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">

        <!-- ⭐ Home - ONLY for non-logged in users -->
        <div sec:authorize="!isAuthenticated()">
            <a href="/" style="color:#9ca3af;text-decoration:none;padding:6px 14px;border-radius:30px;font-size:clamp(12px,1vw,14px);transition:0.3s;">Home</a>
        </div>

        <!-- Authenticated -->
        <div sec:authorize="isAuthenticated()" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
            <a href="/dashboard" style="color:#9ca3af;text-decoration:none;padding:6px 14px;border-radius:30px;font-size:clamp(12px,1vw,14px);transition:0.3s;">Dashboard</a>
            
            <!-- ⭐ Strategy - ONLY PRO USERS -->
            <div th:if="${userRole == 'PRO'}">
                <a href="/strategy" style="color:#9ca3af;text-decoration:none;padding:6px 14px;border-radius:30px;font-size:clamp(12px,1vw,14px);transition:0.3s;">Strategy</a>
            </div>
            
            <a href="/paper-trading" style="color:#9ca3af;text-decoration:none;padding:6px 14px;border-radius:30px;font-size:clamp(12px,1vw,14px);transition:0.3s;">Paper Trading</a>
            
            <!-- ⭐ Trade History - ONLY PRO USERS -->
            <div th:if="${userRole == 'PRO'}">
                <a href="/trade-history" style="color:#9ca3af;text-decoration:none;padding:6px 14px;border-radius:30px;font-size:clamp(12px,1vw,14px);transition:0.3s;">History</a>
            </div>
            
            <a href="/profile" style="color:#9ca3af;text-decoration:none;padding:6px 14px;border-radius:30px;font-size:clamp(12px,1vw,14px);transition:0.3s;">👤 Profile</a>

            <!-- Upgrade / PRO Badge -->
            <div th:if="${userRole == 'FREE'}">
                <a th:href="'/payment/upgrade?email=' + ${email}"
                   style="color:#ffae42;text-decoration:none;padding:6px 16px;border:1.5px solid #ffae42;border-radius:30px;font-size:clamp(11px,1vw,13px);font-weight:600;background:rgba(255,174,66,0.08);transition:0.3s;">
                    💎 Upgrade
                </a>
            </div>
            <div th:if="${userRole == 'PRO'}">
                <span style="color:#00ff88;padding:6px 16px;border:1.5px solid #00ff88;border-radius:30px;font-size:clamp(11px,1vw,13px);font-weight:600;background:rgba(0,255,136,0.08);">
                    💎 PRO
                </span>
            </div>

            <a href="/logout" style="color:#ff4d4d;text-decoration:none;padding:6px 14px;border-radius:30px;font-size:clamp(12px,1vw,14px);transition:0.3s;">🚪 Logout</a>
        </div>

        <!-- Not Authenticated -->
        <div sec:authorize="!isAuthenticated()" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
            <a href="/login" style="color:#9ca3af;text-decoration:none;padding:6px 16px;border-radius:30px;font-size:clamp(12px,1vw,14px);transition:0.3s;">🔑 Login</a>
            <a href="/register" style="background:linear-gradient(135deg,#00ffcc,#00bfff);color:#070b14;padding:6px 20px;border-radius:30px;font-size:clamp(12px,1vw,14px);text-decoration:none;font-weight:600;transition:0.3s;">🚀 Register</a>
        </div>

        <!-- LIVE Badge -->
        <span style="background:rgba(0,255,140,0.1);color:#00ff88;padding:4px 14px;border-radius:30px;border:1px solid #00ff88;font-size:clamp(10px,0.8vw,12px);font-weight:600;display:inline-block;white-space:nowrap;">
            ● LIVE
        </span>
    </div>
</nav>

<!-- Responsive CSS (Inline) -->
<style>
    @media (max-width: 992px) {
        nav { padding: 12px 20px !important; }
        nav>div:last-child { gap: 4px !important; }
    }
    @media (max-width: 768px) {
        nav {
            flex-direction: column !important;
            align-items: stretch !important;
            padding: 12px 16px !important;
            gap: 8px !important;
        }
        nav>div:first-child { justify-content: center !important; }
        nav>div:last-child { justify-content: center !important; gap: 4px !important; flex-wrap: wrap !important; }
        nav a, nav span { font-size: 11px !important; padding: 4px 10px !important; }
    }
    @media (max-width: 480px) {
        nav { padding: 10px 12px !important; }
        nav a, nav span { font-size: 10px !important; padding: 3px 8px !important; }
        nav>div:first-child a { font-size: 16px !important; }
    }
</style>
</body>
</html>

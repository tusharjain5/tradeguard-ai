<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>TradeGuard AI - Trade History</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="shortcut icon" th:href="@{/img/tradeguard.png}" type="image/x-icon">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }

        body {
            background: linear-gradient(135deg, #070b14, #0d1320, #111827);
            color: white;
            padding: 25px;
        }

        .page-title {
            font-size: 28px;
            font-weight: bold;
            color: #00ffcc;
            margin: 20px 0 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 0 20px rgba(0,255,255,0.08);
            transition: 0.3s;
        }

        .card:hover { transform: translateY(-5px); box-shadow: 0 0 30px rgba(0,255,255,0.20); }

        h2 { color: #9ca3af; margin-bottom: 15px; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }

        .big-text { font-size: 30px; font-weight: bold; }
        .green { color: #00ff88; }
        .red   { color: #ff4d4d; }
        .cyan  { color: #00ffcc; }

        .table-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .table-card h2 {
            font-size: 20px;
            color: #00ffcc;
            margin-bottom: 20px;
            text-transform: none;
            letter-spacing: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table th {
            background: rgba(0,0,0,0.3);
            padding: 15px 20px;
            text-align: left;
            color: #6b7280;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        table td {
            padding: 18px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 15px;
            transition: 0.2s;
        }

        table tr:hover td { background: rgba(255,255,255,0.03); }
        table tr:last-child td { border-bottom: none; }

        .badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .badge-buy  { background: rgba(0,255,136,0.15); border: 1px solid #00ff88; color: #00ff88; }
        .badge-sell { background: rgba(255,77,77,0.15);  border: 1px solid #ff4d4d;  color: #ff4d4d; }
        .badge-hold { background: rgba(255,174,66,0.15); border: 1px solid #ffae42; color: #ffae42; }

        .status-running { color: #00ffcc; font-weight: bold; }
        .status-closed  { color: #6b7280; }

        .stat-label { color: #6b7280; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .stat-value { font-size: 28px; font-weight: bold; }

        .footer { text-align: center; margin-top: 40px; color: #6b7280; }

        .plan-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .plan-free { background: rgba(0,255,136,0.15); border: 1px solid #00ff88; color: #00ff88; }
        .plan-pro { background: rgba(255,174,66,0.15); border: 1px solid #ffae42; color: #ffae42; }
    </style>
</head>
<body>

<!-- ⭐ FIXED: Correct fragment syntax -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<br>

<div class="page-title">
    📋 Trade History
    <span th:if="${userRole == 'FREE'}" class="plan-badge plan-free">📊 FREE</span>
    <span th:if="${userRole == 'PRO'}" class="plan-badge plan-pro">💎 PRO</span>
</div>

<!-- SUMMARY STATS -->
<div class="grid">
    <div class="card">
        <div class="stat-label">Total Trades</div>
        <div class="stat-value cyan" th:text="${totalTrades}">0</div>
    </div>
    <div class="card">
        <div class="stat-label">Win Rate</div>
        <div class="stat-value green" th:text="${winRate}">0%</div>
    </div>
    <div class="card">
        <div class="stat-label">Total PnL</div>
        <div class="stat-value" th:class="${totalPnl != null and totalPnl.contains('-') ? 'red' : 'green'}" th:text="${totalPnl}">$0.00</div>
    </div>
    <div class="card">
        <div class="stat-label">Max Drawdown</div>
        <div class="stat-value red" th:text="${maxDrawdown}">$0.00</div>
    </div>
</div>

<!-- TRADE TABLE -->
<div class="table-card">
    <h2>📊 All Trades</h2>
    
    <div th:if="${tradeHistory == null or tradeHistory.isEmpty()}">
        <p style="color:#6b7280;text-align:center;padding:30px;">No trades yet. Start paper trading! 📈</p>
    </div>
    
    <table th:if="${tradeHistory != null and !tradeHistory.isEmpty()}">
        <thead>
            <tr>
                <th>Time</th>
                <th>Signal</th>
                <th>Entry Price</th>
                <th>Exit Price</th>
                <th>Quantity</th>
                <th>PnL</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="trade : ${tradeHistory}">
                <!-- ⭐ FIXED: trade.time → trade.createdAt -->
                <td style="color:#9ca3af;font-size:13px;" th:text="${#temporals.format(trade.createdAt, 'HH:mm:ss')}"></td>
                <td>
                    <span th:if="${trade.signal == 'BUY'}" class="badge badge-buy">🟢 BUY</span>
                    <span th:if="${trade.signal == 'SELL'}" class="badge badge-sell">🔴 SELL</span>
                    <span th:if="${trade.signal == 'HOLD'}" class="badge badge-hold">🟡 HOLD</span>
                </td>
                <td class="cyan" th:text="'$' + ${#numbers.formatDecimal(trade.entryPrice, 0, 2)}"></td>
                <td th:if="${trade.exitPrice != null}" class="cyan" th:text="'$' + ${#numbers.formatDecimal(trade.exitPrice, 0, 2)}"></td>
                <td th:if="${trade.exitPrice == null}" style="color:#6b7280;">-</td>
                <td th:text="${#numbers.formatDecimal(trade.quantity, 0, 6)} + ' BTC'"></td>
                <td th:class="${trade.pnl != null and trade.pnl < 0 ? 'red' : 'green'}" th:text="'$' + ${#numbers.formatDecimal(trade.pnl, 0, 2)}"></td>
                <td>
                    <span th:if="${trade.status == 'OPEN'}" class="status-running">● Running</span>
                    <span th:if="${trade.status == 'CLOSED'}" class="status-closed">✓ Closed</span>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<div class="footer">TradeGuard AI © 2026 — Built for Bitget Hackathon 🏆</div>

<script>
    setTimeout(function(){ location.reload(); }, 30000);
</script>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>TradeGuard AI - Login</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }
        body {
            background: linear-gradient(135deg, #070b14, #0d1320, #111827);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 30px;
            padding: 50px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 0 40px rgba(0,255,204,0.1);
        }
        h1 { color: #00ffcc; margin-bottom: 10px; font-size: 32px; }
        .subtitle { color: #9ca3af; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #9ca3af; font-size: 14px; }
        input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: white;
            font-size: 15px;
            transition: 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #00ffcc;
            box-shadow: 0 0 20px rgba(0,255,204,0.1);
        }
        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00ffcc, #00bfff);
            color: #070b14;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-login:hover { transform: scale(1.02); box-shadow: 0 0 30px rgba(0,255,204,0.3); }
        .register-link { text-align: center; margin-top: 20px; color: #6b7280; }
        .register-link a { color: #00ffcc; text-decoration: none; }
        .register-link a:hover { text-decoration: underline; }
        .error-msg { color: #ff4d4d; text-align: center; margin-bottom: 15px; }
        .success-msg { color: #00ff88; text-align: center; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🔐 Welcome Back</h1>
        <p class="subtitle">Login to your TradeGuard AI account</p>
        
        <div th:if="${param.error}" class="error-msg">❌ Invalid email or password</div>
        <div th:if="${param.logout}" class="success-msg">✅ Logged out successfully</div>
        <div th:if="${message}" class="success-msg" th:text="${message}"></div>
        
        <!-- ⭐ IMPORTANT: action="/login" and method="post" -->
        <form action="/login" method="post">
            <div class="form-group">
                <label>Email</label>
                <!-- ⭐ name="username" - Spring Security expects "username" -->
                <input type="email" name="username" placeholder="Enter your email" required>
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <!-- ⭐ name="password" - Spring Security expects "password" -->
                <input type="password" name="password" placeholder="Enter your password" required>
            </div>
            
            <button type="submit" class="btn-login">🔑 Login</button>
        </form>
        
        <div class="register-link">
            Don't have an account? <a href="/register">Register</a>
        </div>
    </div>
</body>
</html>
